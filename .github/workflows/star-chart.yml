name: star-chart

on:
  schedule:
    - cron: "27 3 * * *"
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch stargazers and draw chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/render-stars-chart.js
      - name: Rasterize SVG to PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 800 docs/assets/stars.svg -o docs/assets/stars.png
      - name: Commit chart if it changed
        run: |
          git add docs/assets/stars.svg docs/assets/stars.png
          if git diff --cached --quiet; then
            echo "star chart unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(cat <<'EOF'
          Docs

          Changes:

          - Refresh the committed GitHub star chart from stargazer timestamps
          EOF
          )"
          git push
