<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-label="FreeDeepseekAPI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0c1624"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ee0c8">
        <animate attributeName="stop-color" values="#3ee0c8;#7c6bff;#3ee0c8" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7c6bff">
        <animate attributeName="stop-color" values="#7c6bff;#3ee0c8;#7c6bff" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="220" rx="18" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#3ee0c8" stroke-width="0.6">
    <path d="M0 40h960M0 80h960M0 120h960M0 160h960M80 0v220M160 0v220M240 0v220M320 0v220M400 0v220M480 0v220M560 0v220M640 0v220M720 0v220M800 0v220M880 0v220"/>
  </g>
  <circle cx="820" cy="70" r="46" fill="#3ee0c8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="42;52;42" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="150" r="36" fill="#7c6bff" opacity="0.16" filter="url(#glow)">
    <animate attributeName="r" values="32;42;32" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="78" fill="#e8f6ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700">FreeDeepseekAPI</text>
  <text x="40" y="112" fill="#9ab0c4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">OpenAI-compatible proxy for DeepSeek Web · V4-Flash Instant · V4-Pro Expert</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="40" y="138" width="118" height="28" rx="14" fill="#12352f" stroke="#3ee0c8"/>
    <text x="99" y="157" text-anchor="middle" fill="#3ee0c8">V4-Flash</text>
    <rect x="168" y="138" width="110" height="28" rx="14" fill="#1b1638" stroke="#7c6bff"/>
    <text x="223" y="157" text-anchor="middle" fill="#bdb6ff">V4-Pro</text>
  </g>
  <rect x="40" y="198" width="880" height="3" rx="2" fill="url(#line)">
    <animate attributeName="width" values="120;880;120" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
