<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Session</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="masthead">
    <h1 class="visually-hidden">DeepSeek Session</h1>
    <img class="brand" src="icons/logo.svg" width="140" height="30" alt="DeepSeek">
    <p class="sub">Export for FreeDeepseekAPI</p>
  </header>

  <section id="callout" class="callout" hidden>
    <p id="calloutTitle" class="callout-title"></p>
    <p id="calloutBody" class="callout-body"></p>
  </section>

  <button type="button" id="btnCollect" class="btn btn-filled">
    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
      <path fill="currentColor" d="M10 3a7 7 0 1 0 6.32 4.09.75.75 0 0 0-1.36-.62A5.5 5.5 0 1 1 10 4.5V6l3-2.25L10 1.5V3z"/>
    </svg>
    Collect from Tab
  </button>

  <section class="group" aria-label="Session fields">
    <div class="row">
      <span class="label">Token</span>
      <span id="rowToken" class="value">—</span>
    </div>
    <div class="row">
      <span class="label">Cookies</span>
      <span id="rowCookie" class="value">—</span>
    </div>
    <div class="row">
      <span class="label">Device headers</span>
      <span id="rowHif" class="value">Optional</span>
    </div>
  </section>

  <div class="actions">
    <button type="button" id="btnCopy" class="btn btn-tinted" disabled>Copy JSON</button>
    <button type="button" id="btnSave" class="btn btn-tinted" disabled>Save File</button>
  </div>

  <details class="json-block">
    <summary>
      <span>JSON</span>
      <svg class="disclosure" viewBox="0 0 9 16" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M2 2.5 7 8 2 13.5"/>
      </svg>
    </summary>
    <pre id="jsonPreview" class="json"></pre>
  </details>

  <p id="detail" class="caption">Open chat.deepseek.com, then Collect.</p>
  <script src="popup.js"></script>
</body>
</html>
