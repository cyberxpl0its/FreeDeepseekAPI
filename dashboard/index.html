<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeDeepseekAPI</title>
  <link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body>
  <header class="top">
    <img class="brand" src="/dashboard/logo.svg" width="140" height="30" alt="DeepSeek">
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab selected" role="tab" aria-selected="true" data-pane="accounts">Accounts</button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-pane="usage">Usage</button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-pane="requests">Requests</button>
  </nav>

  <p id="banner" class="callout" hidden></p>

  <section id="pane-accounts" class="pane">
    <div class="toolbar">
      <p class="hint">One in-flight chat per login. Concurrent clients need a free account.</p>
      <button type="button" class="btn btn-filled" id="btnAdd">Add account</button>
      <input id="fileAdd" type="file" accept="application/json,.json" hidden>
    </div>
    <div id="accountList" class="group"></div>
    <input id="fileReplace" type="file" accept="application/json,.json" hidden>
  </section>

  <section id="pane-usage" class="pane" hidden>
    <div class="metrics">
      <article class="metric">
        <p class="metric-label">Tokens</p>
        <p id="metricTokens" class="metric-value">0</p>
      </article>
      <article class="metric">
        <p class="metric-label">API-equivalent</p>
        <p id="metricUsd" class="metric-value">$0.00</p>
      </article>
      <article class="metric">
        <p class="metric-label">In flight</p>
        <p id="metricFlight" class="metric-value">0</p>
      </article>
    </div>
    <div id="usageList" class="group"></div>
    <p class="caption">Spend is the official Flash/Pro off-peak rate, not a Web bill. This process only — restart clears it.</p>
  </section>

  <section id="pane-requests" class="pane" hidden>
    <div id="requestTable" class="table-wrap"></div>
  </section>

  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
